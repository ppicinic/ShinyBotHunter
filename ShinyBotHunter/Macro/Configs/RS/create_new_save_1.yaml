# New game from boot up to the name-entry keyboard.
#
# Stops deliberately before the keyboard: the OT name is its own macro (SetOTName) so a
# future custom-name feature can swap it without touching this flow.
#
# Recorded frame trace. The first three waits are minimums the recording happened to land
# on, so they carry slack -- the game sits and waits at each of these points, so arriving
# late is harmless while arriving early desyncs the whole run.
#
# The third wait is wide on purpose, and it is what makes one save differ from the next.
# R/S are boot-deterministic, so the trainer ID this save ends up with is a function of how
# many frames elapse before the new game initialises. Measured 2026-08-29 with the three
# waits below spanning 122 possible totals: 16 saves produced 15 distinct TID/SID pairs, a
# collision rate implying a pool of about 120 trainers. That caps save rotation, which is
# the hunt's other lever -- a fresh save re-rolls which PIDs read as shiny, and is worthless
# once it can only re-draw trainers already seen. The width lives on the third wait rather
# than the first because the first sits on the title screen, where a wait this long lets the
# opening demo take over and desyncs every press after it.
