# Name confirm -> intro -> walk to Birch's bag -> save standing in front of it.
#
# The save this leaves behind is the one every hunt cycle resets back to, so the player
# must end up in front of the bag with the game saved. Whatever runs this must flush
# SaveRAM afterwards; BizHawk holds the write in memory, and without a flush the emulator
# can be torn down with the save never reaching disk. CreateSaveEvent already does this.
#
# Long literal frame trace, largely overworld movement. Waits are load-bearing: this walks
# a fixed route, so a press that lands early or late puts the player on the wrong tile and
# every movement after it compounds the error.
