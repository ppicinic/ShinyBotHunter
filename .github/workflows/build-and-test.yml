name: Build and test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ApiHawk is excluded deliberately: it targets net48 and builds against BizHawk assemblies
      # that live in a private fork and are not committed, so it cannot build on a clean runner.
      - name: Run local CI script
        shell: powershell
        run: .\Scripts\ci-local.ps1
