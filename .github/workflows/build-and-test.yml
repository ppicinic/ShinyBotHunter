name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ApiHawk is excluded deliberately: it targets net48 and builds against BizHawk assemblies
      # that live in a private fork and are not committed, so it cannot build on a clean runner.
      - name: Restore
        run: dotnet restore ShinyBotHunter.Tests/ShinyBotHunter.Tests.csproj

      - name: Build
        run: dotnet build ShinyBotHunter.Tests/ShinyBotHunter.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test ShinyBotHunter.Tests/ShinyBotHunter.Tests.csproj --no-build -c Release --verbosity normal
